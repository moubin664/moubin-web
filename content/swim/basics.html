
              <h3>           </h3>
              <p>1.流程：游泳前先喝水，洗澡，过涮脚池，再入水。用手往身上拨水，适应水温，再整个身体入水。泳后一定要洗澡，大小便，喝水，目的是清洗身体表面的氯，排出体内可能在水中沾染的脏东西，并补水。<br>
                 2.泳帽是竖着戴的。<br>
                 3.刚学先在水中憋气，适应水压你肺的感觉<br>
                 4.游泳减肥吗？如果要减的是体脂比，可以。但一定是与饮食控制等相配合的，游泳只是减肥过程中的一个环节。<br>
                 5.泳镜必须戴，最重要的原因是卫生问题，防止传染病和感染。<br>
