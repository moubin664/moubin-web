<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>某彬·个人空间</title>

<link rel="stylesheet" href="style.css">
</head>
<body class="welcome-pending">

</section>

<div class="passage-screen" id="passageScreen" aria-hidden="true" hidden>
  <div class="passage-person" aria-hidden="true">
    <span class="passage-head"></span>
    <span class="passage-body"></span>
    <span class="passage-leg passage-leg-left"></span>
    <span class="passage-leg passage-leg-right"></span>
  </div>
</div>

<div class="site-content" id="siteContent" aria-hidden="true" inert>

<header id="siteHeader">
  <div class="brand">
    某彬·个人空间
  </div>
  <nav class="mainnav" id="mainNav">
    <button data-target="home" class="active">首页</button>
    <button data-target="reading">读书笔记</button>
    <button data-target="articles">文章</button>
    <button data-target="swim">游泳知识</button>
    <button data-target="ai">AI</button>
    <button data-target="ending">结尾</button>
  </nav>
  <button class="nav-toggle" id="navToggle" type="button" aria-label="打开菜单" aria-controls="mainNav" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<main>

  <!-- ============ HOME ============ -->
<section class="section active" id="home" data-section>

<div class="home-page">

    <div class="minimal-hero">


        <div class="minimal-boy">

            <div class="head"></div>

            <div class="body"></div>

            <div class="leg left"></div>

            <div class="leg right"></div>

        </div>


        <div class="minimal-text">
            <p>我一直在努力变得更好。</p>
        </div>

        <button class="hidden-door" type="button" data-target="other-side" aria-label="进入暗面">
            <span class="door-caption">一扇门...</span>
            <span class="door-figure" aria-hidden="true">
                <span class="door-leaf">
                    <span class="door-knob"></span>
                </span>
            </span>
        </button>


    </div>

</div>

</section>

  <!-- ============ DARK SIDE ============ -->
  <section class="section" id="other-side" data-section>
    <div class="other-side-page">
      <button class="other-side-return" type="button" data-target="home" aria-label="返回明面">←</button>
      <p class="other-side-empty-text">无内容</p>
    </div>
  </section>

  <!-- ============ READING ============ -->
  <section class="section" id="reading" data-section>
    <div class="reading-layout">
      <div class="reading-content">
        <div class="reading-sidebar">
          <button class="reading-category" type="button" data-reading-tab="r1" aria-pressed="false">历史记忆</button>
          <button class="reading-category" type="button" data-reading-tab="r2" aria-pressed="false">毛选提炼</button>
          <button class="reading-category" type="button" data-reading-tab="r3" aria-pressed="false">自由空间</button>
        </div>
        <div class="reading-main">
          <div class="reading-placeholder" id="readingPlaceholder">
            <svg class="reading-svg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
              <rect x="30" y="40" width="140" height="100" rx="4" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <line x1="30" y1="65" x2="170" y2="65" stroke="currentColor" stroke-width="1" opacity="0.6"/>
              <line x1="30" y1="85" x2="155" y2="85" stroke="currentColor" stroke-width="1" opacity="0.6"/>
              <line x1="30" y1="105" x2="140" y2="105" stroke="currentColor" stroke-width="1" opacity="0.6"/>
              <line x1="30" y1="125" x2="160" y2="125" stroke="currentColor" stroke-width="1" opacity="0.6"/>
              <rect x="70" y="25" width="60" height="20" rx="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <circle cx="90" cy="35" r="4" fill="currentColor" opacity="0.5"/>
              <circle cx="110" cy="35" r="4" fill="currentColor" opacity="0.5"/>
            </svg>
            <p>翻开一页，慢慢读。</p>
          </div>
          <div class="reading-tab-content" data-reading-panel="r1">
            <div class="reading-content-view" data-content-host data-content-key="reading.r1"></div>
          </div>
          <div class="reading-tab-content" data-reading-panel="r2">
            <div class="reading-content-view mao-reading-view" data-mao-reader data-content-host data-content-key="reading.mao">
              <section class="mao-directory" data-mao-directory aria-labelledby="maoDirectoryTitle">
                <div class="mao-directory-heading">
                  <span></span>
                  <h2 id="maoDirectoryTitle">目录</h2>
                  <p></p>
                </div>
                <div class="mao-directory-list" data-mao-directory-list>
                  <!-- 文章目录会根据下方每篇文章中的 h3 标签自动生成。 -->
                </div>
              </section>

              <div class="mao-article-reader" data-mao-article-reader hidden></div>
            </div>
          </div>
          <div class="reading-tab-content" data-reading-panel="r3">
            <div class="reading-content-view" data-content-host data-content-key="reading.r3"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ ARTICLES ============ -->
  <section class="section" id="articles" data-section>
    <div class="notes-layout articles-layout">
      <div class="notes-content">
        <div class="notes-sidebar" aria-label="文章子分类">
          <button class="notes-category" type="button" data-notes-tab="a1" aria-pressed="false">好词好句</button>
          <button class="notes-category" type="button" data-notes-tab="a2" aria-pressed="false">2</button>
          <button class="notes-category" type="button" data-notes-tab="a3" aria-pressed="false">3</button>
          <button class="notes-category" type="button" data-notes-tab="a4" aria-pressed="false">4</button>
          <button class="notes-category" type="button" data-notes-tab="a5" aria-pressed="false">5</button>
        </div>

        <div class="notes-main">
          <div class="notes-placeholder" data-notes-placeholder>
            <p>随意看看吧。</p>
          </div>

          <div class="notes-tab-content" data-notes-panel="a1">
            <div class="notes-content-view article-content-view" data-content-host data-content-key="articles.a1"></div>
          </div>

          <div class="notes-tab-content" data-notes-panel="a2">
            <div class="notes-content-view article-content-view" data-content-host data-content-key="articles.a2"></div>
          </div>

          <div class="notes-tab-content" data-notes-panel="a3">
            <div class="notes-content-view article-content-view" data-content-host data-content-key="articles.a3"></div>
          </div>

          <div class="notes-tab-content" data-notes-panel="a4">
            <div class="notes-content-view article-content-view" data-content-host data-content-key="articles.a4"></div>
          </div>

          <div class="notes-tab-content" data-notes-panel="a5">
            <div class="notes-content-view article-content-view" data-content-host data-content-key="articles.a5"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ SWIM ============ -->
  <section class="section" id="swim" data-section>
    <div class="swim-layout">
      <div class="swim-content">
        <div class="swim-sidebar">
          <button class="swim-category" type="button" data-swim-tab="s1" aria-pressed="false">游泳体验</button>
          <button class="swim-category" type="button" data-swim-tab="s2" aria-pressed="false">基础知识</button>
          <button class="swim-category" type="button" data-swim-tab="s3" aria-pressed="false">进阶知识</button>
          <button class="swim-category" type="button" data-swim-tab="s4" aria-pressed="false">装备分享</button>
          <button class="swim-category" type="button" data-swim-tab="s5" aria-pressed="false">场地选择</button>
          <button class="swim-category" type="button" data-swim-tab="s6" aria-pressed="false">游泳姿势</button>
          <button class="swim-category" type="button" data-swim-tab="s7" aria-pressed="false">蛙泳技巧</button>
        </div>
        <div class="swim-main">
          <div class="swim-placeholder" id="swimPlaceholder">
            <svg class="swim-svg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 140 Q60 100 100 130 T180 110" stroke="currentColor" stroke-width="1" fill="none" opacity="0.3"/>
              <path d="M20 120 Q60 80 100 110 T180 90" stroke="currentColor" stroke-width="1" fill="none" opacity="0.4"/>
              <path d="M20 100 Q60 60 100 90 T180 70" stroke="currentColor" stroke-width="1" fill="none" opacity="0.5"/>
              <ellipse cx="100" cy="75" rx="25" ry="45" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <ellipse cx="100" cy="75" rx="18" ry="35" stroke="currentColor" stroke-width="1" fill="none"/>
              <circle cx="92" cy="68" r="3" fill="currentColor"/>
              <circle cx="108" cy="68" r="3" fill="currentColor"/>
              <path d="M85 95 Q100 105 115 95" stroke="currentColor" stroke-width="1" fill="none"/>
              <path d="M75 110 Q60 120 70 130" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <path d="M125 110 Q140 120 130 130" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <path d="M80 55 Q70 40 85 35" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <path d="M120 55 Q130 40 115 35" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <circle cx="100" cy="50" r="6" fill="none" stroke="currentColor" stroke-width="1"/>
            </svg>
            <p>关于游泳的一切</p>
          </div>
          <div class="swim-tab-content" data-swim-panel="s1">
            <div class="swim-content-view" data-content-host data-content-key="swim.s1"></div>
          </div>
          <div class="swim-tab-content" data-swim-panel="s2">
            <div class="swim-content-view" data-content-host data-content-key="swim.s2"></div>
          </div>
          <div class="swim-tab-content" data-swim-panel="s3">
            <div class="swim-content-view" data-content-host data-content-key="swim.s3"></div>
          </div>
          <div class="swim-tab-content" data-swim-panel="s4">
            <div class="swim-content-view" data-content-host data-content-key="swim.s4"></div>
          </div>
          <div class="swim-tab-content" data-swim-panel="s5">
            <div class="swim-content-view" data-content-host data-content-key="swim.s5"></div>
          </div>
          <div class="swim-tab-content" data-swim-panel="s6">
            <div class="swim-content-view" data-content-host data-content-key="swim.s6"></div>
          </div>
          <div class="swim-tab-content" data-swim-panel="s7">
            <div class="swim-content-view" data-content-host data-content-key="swim.s7"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ AI ============ -->
  <section class="section" id="ai" data-section>
    <div class="reading-layout ai-layout">
      <div class="reading-content">
        <div class="reading-sidebar" aria-label="AI 子分类">
          <button class="reading-category" type="button" data-ai-tab="ai-memory" aria-pressed="false">记忆</button>
          <button class="reading-category" type="button" data-ai-tab="ai-1" aria-pressed="false">1</button>
          <button class="reading-category" type="button" data-ai-tab="ai-2" aria-pressed="false">2</button>
          <button class="reading-category" type="button" data-ai-tab="ai-3" aria-pressed="false">3</button>
        </div>
        <div class="reading-main">
          <div class="reading-placeholder" data-ai-placeholder>
            <svg class="reading-svg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="30" y="40" width="140" height="100" rx="4" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <line x1="30" y1="65" x2="170" y2="65" stroke="currentColor" stroke-width="1" opacity="0.6"/>
              <line x1="30" y1="85" x2="155" y2="85" stroke="currentColor" stroke-width="1" opacity="0.6"/>
              <line x1="30" y1="105" x2="140" y2="105" stroke="currentColor" stroke-width="1" opacity="0.6"/>
              <line x1="30" y1="125" x2="160" y2="125" stroke="currentColor" stroke-width="1" opacity="0.6"/>
              <rect x="70" y="25" width="60" height="20" rx="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <circle cx="90" cy="35" r="4" fill="currentColor" opacity="0.5"/>
              <circle cx="110" cy="35" r="4" fill="currentColor" opacity="0.5"/>
            </svg>
            <p>从一个话题开始。</p>
          </div>

          <div class="reading-tab-content" data-ai-panel="ai-memory">
            <div class="reading-content-view ai-article" data-content-host data-content-key="ai.memory"></div>
          </div>

          <div class="reading-tab-content" data-ai-panel="ai-1">
            <div class="reading-content-view" data-content-host data-content-key="ai.ai1"></div>
          </div>

          <div class="reading-tab-content" data-ai-panel="ai-2">
            <div class="reading-content-view" data-content-host data-content-key="ai.ai2"></div>
          </div>

          <div class="reading-tab-content" data-ai-panel="ai-3">
            <div class="reading-content-view" data-content-host data-content-key="ai.ai3"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ ENDING ============ -->
  <section class="section" id="ending" data-section>
    <div class="ending-page">
      <div class="ending-hero">
        <div class="minimal-boy ending-boy" aria-hidden="true">
          <div class="head"></div>
          <div class="body"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>
        <div class="ending-text">
          <p>
            <span>与天奋斗，其乐无穷；</span>
            <span>与地奋斗，其乐无穷；</span>
            <span>与人奋斗，其乐无穷。</span>
          </p>
        </div>
      </div>
    </div>
  </section>

</main>

</div>

<script src="content-manifest.js"></script>

<script src="script.js"></script>

</body>
</html>
